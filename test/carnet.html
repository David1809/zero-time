<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171816">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ZERO TIME — Carnet technicien</title>
<style>
:root{
 --ink:#000;--muted:#000;--paper:#dfd0ad;--paper2:#cdbb94;
 --edge:#927c56;--dark:#171714;--orange:#c47a32;--red:#873e32;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 color:#eee8dc;font-family:Georgia,"Times New Roman",serif;
 background:
  radial-gradient(ellipse at 50% 0%,#39382f 0,#1d1e1a 48%,#10110f 100%);
 padding:clamp(5px,1.5vh,14px) 9px;
}
.shell{
 width:min(100%,680px);height:100%;height:100dvh;max-height:100dvh;
 margin:0 auto;display:flex;flex-direction:column;min-height:0;
}
.topline{
 flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin:0 4px 7px;color:#b8aa8e;
 font:9px/1.2 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;
}
.brand{font-weight:700;color:#d7a05c}.status{color:#8e897d;text-align:right}
.book{
 flex:1;min-height:0;position:relative;display:flex;flex-direction:column;
 padding:9px 9px 8px;border-radius:7px 11px 11px 7px;
 background:
  repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 4px),
  linear-gradient(90deg,#211f1a 0,#514838 2%,#28251f 4%,#171815 8%,#302b22 100%);
 box-shadow:0 15px 38px #000b,inset 1px 0 #7d705a,inset -2px 0 #080908;
}
.book:before{
 content:"";position:absolute;z-index:2;left:13px;top:12px;bottom:12px;width:7px;
 border-radius:5px;background:repeating-linear-gradient(to bottom,#11120f 0 6px,#79694e 7px 8px,#292820 9px 14px);
 opacity:.95;pointer-events:none
}
.book:after{
 content:"";position:absolute;right:5px;top:12px;bottom:12px;width:3px;
 background:linear-gradient(90deg,#9a8968,#39352b,#161714);opacity:.75;pointer-events:none
}
.tabs{
 flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-around;
 gap:clamp(3px,1vw,8px);margin:0 7px 7px 19px;padding:1px 2px 4px;
 overflow:visible;
}
.tab{
 position:relative;flex:1;min-width:0;max-width:68px;height:37px;
 border:0;border-radius:2px 2px 3px 3px;padding:5px 2px 4px;
 color:#514638;font:bold 9px/1 Arial,sans-serif;cursor:pointer;
 box-shadow:1px 3px 5px #0008,inset 0 1px #ffffff88;
 transform:rotate(var(--tilt,-2deg));transition:transform .18s,filter .18s;
 clip-path:polygon(0 0,100% 0,100% 91%,50% 100%,0 91%);
}
.tab:nth-child(1){background:#d8c46f;--tilt:-3deg}
.tab:nth-child(2){background:#a9c4a0;--tilt:2deg}
.tab:nth-child(3){background:#d69c82;--tilt:-1deg}
.tab:nth-child(4){background:#a8bdc8;--tilt:3deg}
.tab:nth-child(5){background:#c3a9c8;--tilt:-2deg}
.tab:nth-child(6){background:#d6b28a;--tilt:1deg}
.tab:nth-child(7){background:#c6c5a0;--tilt:-3deg}
.tab:nth-child(8){background:#d4a7a0;--tilt:2deg}
.tab:before{content:"";position:absolute;top:0;left:24%;width:52%;height:4px;background:#ffffff55}
.tab[aria-current="page"]{height:43px;transform:translateY(-3px) rotate(0deg);filter:brightness(1.08);z-index:1}
.paper-wrap{flex:1;min-height:0;margin-left:15px;margin-right:7px;perspective:1200px}
.paper{
 position:relative;height:100%;min-height:0;padding:clamp(12px,2.4vh,23px) clamp(13px,4vw,27px) 12px clamp(19px,5vw,31px);
 color:var(--ink);overflow:hidden;
 background:
  radial-gradient(ellipse at 13% 7%,#fff9e0a8,transparent 32%),
  radial-gradient(ellipse at 93% 90%,#8d704622,transparent 42%),
  radial-gradient(ellipse at 42% 48%,transparent 35%,#8e75401b 100%),
  repeating-linear-gradient(0deg,#5b48200b 0 1px,transparent 1px 3px),
  linear-gradient(105deg,#e9dfc6,#d9c9a7 58%,#cfbd98);
 box-shadow:inset 0 0 38px #80694366,inset 0 0 3px #786341,2px 3px 8px #0009;
 transform-origin:left center;transition:transform .32s ease,opacity .32s ease;
}
.paper:before{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
 background:
  radial-gradient(ellipse at 8% 18%,#876b3d25 0 1px,transparent 2px),
  radial-gradient(ellipse at 92% 74%,#6d512b22 0 2px,transparent 3px),
  linear-gradient(90deg,#715b3b30,transparent 8%,transparent 93%,#715b3b22);
}
.paper:after{content:"";position:absolute;left:11px;top:0;bottom:0;width:1px;background:#9b795066}
.paper.turn-next{transform:rotateY(-8deg) translateX(4px);opacity:.72}
.paper.turn-prev{transform:rotateY(8deg) translateX(-4px);opacity:.72}
.page-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #8d7955;padding-bottom:6px;margin-bottom:9px}
.kicker{font:bold 8px Arial,sans-serif;letter-spacing:.16em;color:#000;text-transform:uppercase}
.page-number{font:9px "Courier New",monospace;color:#000}
h1{font-size:clamp(19px,5vw,29px);line-height:1.02;margin:0 0 4px;font-weight:normal;letter-spacing:.01em}
.subtitle{font:italic 11px Georgia,serif;color:#71634d;margin-bottom:8px}
.stamp{display:inline-block;border:2px solid #b3261e;color:#b3261e;padding:4px 8px;transform:rotate(-4deg);font:bold 9px Arial,sans-serif;letter-spacing:.14em;margin:0 0 9px;opacity:.9;mix-blend-mode:multiply}
.signature{border:1px solid #9d8966;background:#d2c09d99;padding:7px 9px;margin:0 0 10px;box-shadow:inset 0 0 12px #8b734122}
.signature-label{font:bold 8px Arial,sans-serif;letter-spacing:.16em;color:#000;text-transform:uppercase;margin-bottom:4px}
.signature-value{font-size:clamp(14px,3.8vw,18px);line-height:1.16}
.section-title{font:bold 8px Arial,sans-serif;letter-spacing:.17em;text-transform:uppercase;color:#000;border-bottom:1px solid #a08c67;padding-bottom:4px;margin:9px 0 7px}
.rules{list-style:none;padding:0;margin:0;counter-reset:rule}
.rules li{counter-increment:rule;position:relative;padding:0 0 6px 27px;margin:0 0 6px;border-bottom:1px dotted #9f8b67;font-size:clamp(11px,3vw,14px);line-height:1.28}
.rules li:before{content:counter(rule,decimal-leading-zero);position:absolute;left:0;top:1px;color:#000;font:10px "Courier New",monospace}
.rules strong{font-weight:bold}
.final-rule{margin-top:8px;padding:8px 9px;border-left:3px solid #a14b35;background:#cabb9b99;font-size:clamp(11px,3vw,13px);line-height:1.3}
.final-rule b{display:block;font:bold 8px Arial,sans-serif;letter-spacing:.15em;color:#000;margin-bottom:3px}
.note{font:italic 10px/1.3 Georgia,serif;color:#000;margin:8px 0 0}
.sketch{display:none}
.footer{
 flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
 margin:7px 7px 0 19px;color:#9d927e;font:8px Arial,sans-serif;letter-spacing:.07em;
}
.controls{display:flex;gap:7px;align-items:center}
.navbtn{border:1px solid #665b47;border-radius:3px;background:linear-gradient(#454137,#292820);color:#e7dcc6;padding:7px 12px;box-shadow:0 2px 5px #0008}
.navbtn:disabled{opacity:.3;cursor:not-allowed}
.counter{min-width:42px;text-align:center;color:#c9bda6;font:10px "Courier New",monospace}
.hint{display:none}
@media(max-height:650px){
 .topline{margin-bottom:4px;font-size:8px}
 .book{padding-top:6px;padding-bottom:5px}
 .tabs{margin-bottom:4px}.tab{height:31px}.tab[aria-current="page"]{height:35px}
 .paper{padding-top:9px;padding-bottom:8px}
 .page-head{margin-bottom:6px}.subtitle{margin-bottom:5px}.stamp{margin-bottom:6px}
 .signature{padding:5px 7px;margin-bottom:6px}.section-title{margin:6px 0 5px}
 .rules li{padding-bottom:4px;margin-bottom:4px;line-height:1.2}
 .final-rule{margin-top:5px;padding:6px 7px}.note{margin-top:5px}
}
@media(min-width:700px){
 .shell{width:min(100%,760px)}
 .book{padding:13px 14px 10px}
 .paper{padding:24px 42px 18px 46px}
 .paper-wrap{margin-left:22px}
 .tabs{margin-left:27px}
 .tab{height:43px;font-size:10px}.tab[aria-current="page"]{height:49px}
 .book:before{left:19px;width:9px}
 .rules li{font-size:14px;line-height:1.4;padding-bottom:8px;margin-bottom:8px}
 .signature{padding:10px 12px;margin-bottom:13px}
 .section-title{margin:13px 0 10px}
 .final-rule{padding:10px 12px;margin-top:11px}
 .note{font-size:11px;margin-top:12px}
}
@media(prefers-reduced-motion:reduce){.paper,.tab{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="topline"><span class="brand">ZERO TIME / DOCUMENTS</span><span class="status">COPIE TERRAIN · ÉDITION 07</span></div>
  <main class="book" aria-label="Carnet de procédures">
    <nav class="tabs" id="tabs" aria-label="Onglets du carnet"></nav>
    <div class="paper-wrap">
      <article class="paper" id="paper" aria-live="polite"></article>
    </div>
    <div class="footer">
      <span>ARCHIVES TECHNIQUES · CONFIDENTIEL</span>
      <div class="controls">
        <button class="navbtn" id="prev" aria-label="Page précédente">←</button>
        <span class="counter" id="counter">01 / 08</span>
        <button class="navbtn" id="next" aria-label="Page suivante">→</button>
      </div>
    </div>
  </main>
  <p class="hint">Carnet technicien — 8 fiches.</p>
</div>
<script>
const pages = [
 {
  "stamp": "À VÉRIFIER",
  "sig": "5 fils — exactement noir, rouge et jaune",
  "rules": [
   "S’il y a exactement deux fils <strong>rouges</strong>, coupez le dernier fil <strong>rouge</strong>.",
   "Sinon, si le dernier fil est <strong>noir</strong>, coupez le deuxième fil.",
   "Sinon, si la bombe porte au moins 3 piles, coupez le premier fil <strong>jaune</strong>."
  ],
  "end": "Dans tous les autres cas, coupez le dernier fil.",
  "note": "Fils numérotés de haut en bas. Arrêtez-vous à la première consigne qui s’applique.",
  "ref": "FICHE 01"
 },
 {
  "stamp": "VÉRIFIER LES PILES",
  "sig": "Voyants allumés — 2 rouges et 1 bleu",
  "rules": [
   "<strong>2 piles</strong> — saisissez <strong>6 4 0 8</strong>.",
   "<strong>3 piles</strong> — saisissez <strong>5 0 1 6</strong>.",
   "<strong>4 piles</strong> — saisissez <strong>4 6 2 3</strong>."
  ],
  "end": "Annoncez les quatre chiffres à l’opérateur, un par un, dans cet ordre.",
  "note": "Comptez d’abord les piles de la bombe. Les quatre chiffres sont tous différents ; un code refusé compte comme une erreur.",
  "ref": "FICHE 02"
 },
 {
  "stamp": "DOUBLE CONTRÔLE",
  "sig": "6 fils — exactement blanc, bleu et vert",
  "rules": [
   "S’il y a plus de fils <strong>blancs</strong> que de fils <strong>bleus</strong>, coupez le dernier fil <strong>blanc</strong>.",
   "Sinon, si deux fils <strong>verts</strong> se suivent, coupez le premier fil <strong>vert</strong>.",
   "Sinon, si la bombe porte au moins 3 piles, coupez le deuxième fil."
  ],
  "end": "Dans tous les autres cas, coupez l’avant-dernier fil.",
  "note": "Fils numérotés de haut en bas. Arrêtez-vous à la première consigne qui s’applique.",
  "ref": "FICHE 03"
 },
 {
  "stamp": null,
  "sig": "5 fils — exactement noir, rouge et bleu",
  "rules": [
   "S’il y a exactement deux fils <strong>rouges</strong>, coupez le premier fil <strong>rouge</strong>.",
   "Sinon, si le dernier fil est <strong>noir</strong>, coupez le troisième fil.",
   "Sinon, si la bombe porte au moins 3 piles, coupez le premier fil <strong>bleu</strong>."
  ],
  "end": "Dans tous les autres cas, coupez le dernier fil.",
  "note": "Fils numérotés de haut en bas. Arrêtez-vous à la première consigne qui s’applique.",
  "ref": "FICHE 04"
 },
 {
  "stamp": "ORDRE IMPÉRATIF",
  "sig": "4 fils — exactement rouge et bleu",
  "rules": [
   "S’il y a plus de fils <strong>bleus</strong> que de fils <strong>rouges</strong>, coupez le dernier fil <strong>bleu</strong>.",
   "Sinon, si le premier fil est <strong>rouge</strong>, coupez le troisième fil.",
   "Sinon, si la bombe porte au plus 3 piles, coupez le dernier fil <strong>rouge</strong>."
  ],
  "end": "Dans tous les autres cas, coupez le deuxième fil.",
  "note": "Fils numérotés de haut en bas. Arrêtez-vous à la première consigne qui s’applique.",
  "ref": "FICHE 05"
 },
 {
  "stamp": null,
  "sig": "Voyants allumés — 2 rouges et 2 bleus",
  "rules": [
   "<strong>2 piles</strong> — saisissez <strong>1 6 5 9</strong>.",
   "<strong>3 piles</strong> — saisissez <strong>9 1 7 3</strong>.",
   "<strong>4 piles</strong> — saisissez <strong>8 0 7 2</strong>."
  ],
  "end": "Annoncez les quatre chiffres à l’opérateur, un par un, dans cet ordre.",
  "note": "Comptez d’abord les piles de la bombe. Les quatre chiffres sont tous différents ; un code refusé compte comme une erreur.",
  "ref": "FICHE 06"
 },
 {
  "stamp": "LECTURE AVANT ACTION",
  "sig": "6 fils — exactement blanc, rouge et bleu",
  "rules": [
   "S’il y a plus de fils <strong>blancs</strong> que de fils <strong>rouges</strong>, coupez le dernier fil <strong>blanc</strong>.",
   "Sinon, si deux fils <strong>bleus</strong> se suivent, coupez le premier fil <strong>bleu</strong>.",
   "Sinon, si la bombe porte 4 piles, coupez le troisième fil."
  ],
  "end": "Dans tous les autres cas, coupez le dernier fil.",
  "note": "Fils numérotés de haut en bas. Arrêtez-vous à la première consigne qui s’applique.",
  "ref": "FICHE 07"
 },
 {
  "stamp": "À VÉRIFIER",
  "sig": "7 fils — exactement noir, blanc et jaune",
  "rules": [
   "S’il y a au moins trois fils <strong>noirs</strong>, coupez le dernier fil <strong>noir</strong>.",
   "Sinon, si le quatrième fil est <strong>jaune</strong>, coupez le deuxième fil.",
   "Sinon, si la bombe porte au moins 3 piles, coupez le premier fil <strong>jaune</strong>."
  ],
  "end": "Dans tous les autres cas, coupez le dernier fil.",
  "note": "Fils numérotés de haut en bas. Arrêtez-vous à la première consigne qui s’applique.",
  "ref": "FICHE 08"
 }
];

let current=0;
const tabs=document.getElementById('tabs'),paper=document.getElementById('paper');
function render(){
 tabs.innerHTML=pages.map((p,i)=>`<button class="tab" data-page="${i}" aria-label="Post-it ${i+1}" title="Fiche ${i+1}" ${i===current?'aria-current="page"':''}></button>`).join('');
 const p=pages[current];
 paper.innerHTML=`
  <header class="page-head"><span class="kicker">ZERO TIME · CARNET TECHNICIEN</span><span class="page-number">${p.ref}</span></header>
  ${p.stamp?`<div class="stamp">${p.stamp}</div>`:''}
  <section class="signature"><div class="signature-label">Signature observée</div><div class="signature-value">${p.sig}</div></section>
  <div class="section-title">Consignes à appliquer</div>
  <ol class="rules">${p.rules.map(r=>`<li>${r}</li>`).join('')}</ol>
  <div class="final-rule"><b>RÈGLE FINALE</b>${p.end}</div>
  <p class="note">${p.note}</p>
  <div class="sketch">— NOTES DE TERRAIN / ${String(current+1).padStart(2,'0')} —<br><br>IDENTIFIER · LIRE · TRANSMETTRE</div>`;
 document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}`;
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').disabled=current===pages.length-1;
}
function go(to){
 if(to<0||to>=pages.length||to===current)return;
 const direction=to>current?'turn-next':'turn-prev';
 paper.classList.add(direction);
 setTimeout(()=>{current=to;render();paper.classList.remove('turn-next','turn-prev')},150);
}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(Number(b.dataset.page))});
document.getElementById('prev').addEventListener('click',()=>go(current-1));
document.getElementById('next').addEventListener('click',()=>go(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight')go(current+1)});
let touchX=null;
paper.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});
paper.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)go(current+(dx<0?1:-1));touchX=null},{passive:true});
render();
</script>
</body>
</html>
